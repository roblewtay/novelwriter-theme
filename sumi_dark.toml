# Sumi (墨) — ink-stone blacks with cream paper text and muted accents
# Companion dark theme to "Washi (Japanese Light)"
#   sumi     #1b1916  ink        kuro    #141210  deep black
#   washi    #e6dcc6  paper      shu     #d0665a  vermilion
#   kaki     #d08a52  persimmon  kincha  #c9a75a  golden tea
#   matcha   #9aa865  matcha     asagi   #6fa8a2  pale indigo
#   ai       #7f9cc0  indigo     sakura  #e3a3b4  cherry blossom (highlights)

[Main]
name   = "Sumi (Japanese Dark)"
mode   = "dark"
author = "Custom"
credit = "Inspired by traditional Japanese colours"
url    = "https://novelwriter.io/docs/more/customise.html"

[Base]
base    = "#1b1916"
default = "#e6dcc6"
faded   = "#8a8172"
red     = "#d0665a"
orange  = "#d08a52"
yellow  = "#c9a75a"
green   = "#9aa865"
cyan    = "#6fa8a2"
blue    = "#7f9cc0"
purple  = "#e3a3b4"

[Project]
root     = "blue"
folder   = "yellow"
file     = "default"
title    = "red"
chapter  = "red"
scene    = "blue"
note     = "yellow"
active   = "green"
inactive = "red"
disabled = "faded"

[Icon]
tool      = "default"
sidebar   = "default"
accept    = "green"
reject    = "red"
action    = "blue"
option    = "orange"
apply     = "green"
create    = "yellow"
destroy   = "faded"
reset     = "green"
add       = "green"
change    = "green"
remove    = "red"
shortcode = "default"
markdown  = "orange"
system    = "yellow"
info      = "blue"
warning   = "orange"
error     = "red"

[Palette]
window          = "#141210"
windowText      = "default"
base            = "base"
alternateBase   = "#24211d"
text            = "default"
tooltipBase     = "#e6dcc6"
tooltipText     = "#1b1916"
button          = "#26231f"
buttonText      = "default"
brightText      = "#f3ebd9"
highlight       = "#5c3442"
highlightedText = "#f7e6ea"
link            = "blue"
linkVisited     = "purple"
accent          = "purple"

[GUI]
helpText     = "#a59c8c"
fadedText    = "faded"
errorText    = "red"
accentText   = "purple"
activeButton = "purple:80"
activeBase   = "#3a2a2e"
searchMatch  = "purple:80"

[Syntax]
background     = "base"
text           = "default"
line           = "default:32"
link           = "blue"
headerText     = "red"
headerTag      = "red:D150"
emphasis       = "orange"
whitespace     = "faded:64"
dialog         = "blue"
altDialog      = "purple"
note           = "yellow"
hidden         = "faded"
shortcode      = "cyan"
keyword        = "red"
tag            = "green"
value          = "green"
optional       = "cyan"
spellCheckLine = "red"
errorLine      = "green"
replaceTag     = "green"
modifier       = "blue"
textHighlight  = "purple:72"
